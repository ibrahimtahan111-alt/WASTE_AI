<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}WasteAI{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .navbar-brand {
      font-weight: bold;
      font-size: 1.25rem;
    }
    #back-btn {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">♻ WasteAI</a>
      <button id="back-btn" class="btn btn-outline-light btn-sm ms-auto">
        ⬅ Back
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mb-5">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <small>© {{ current_year|default(2025) }} WasteAI | Smart Waste Management</small>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Show back button if there’s history
    document.addEventListener("DOMContentLoaded", () => {
      const backBtn = document.getElementById("back-btn");
      if (window.history.length > 1) {
        backBtn.style.display = "inline-block";
        backBtn.addEventListener("click", () => window.history.back());
      }
    });
  </script>
</body>
</html>
